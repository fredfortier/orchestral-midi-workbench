[mcp_servers.osc]
enabled = true
command = "uv"
args = ["run", "--locked", "--no-dev", "python", "-m", "bitwig_mcp_server"]
cwd = "/home/user/src/fredfortier/MIDI2.0Workbench/crates/bitwig-mcp-server"
# Allow dependency setup and initialization; OSC feedback has a separate timeout.
startup_timeout_sec = 60

[mcp_servers.osc.env]
BITWIG_MCP_BITWIG_HOST = "127.0.0.1"
BITWIG_MCP_BITWIG_SEND_PORT = "8000"
BITWIG_MCP_BITWIG_RECEIVE_PORT = "9000"
