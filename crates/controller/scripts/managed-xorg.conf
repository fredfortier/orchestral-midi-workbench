Section "ServerFlags"
    Option "AutoAddDevices" "false"
    Option "AllowMouseOpenFail" "true"
EndSection
Section "Device"
    Identifier "ManagedDummy"
    Driver "dummy"
    VideoRam 256000
EndSection
Section "Monitor"
    Identifier "ManagedMonitor"
    HorizSync 5.0-1000.0
    VertRefresh 5.0-200.0
    Modeline "1600x1000_60.00" 132.25 1600 1696 1864 2128 1000 1003 1009 1038 -hsync +vsync
EndSection
Section "Screen"
    Identifier "ManagedScreen"
    Device "ManagedDummy"
    Monitor "ManagedMonitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1600x1000_60.00"
    EndSubSection
EndSection
